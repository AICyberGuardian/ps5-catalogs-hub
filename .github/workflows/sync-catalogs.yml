name: Sync PS5 Catalogs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch validate and publish catalogs
        run: python scripts/catalog_hub_sync.py

      - name: Commit if changed
        run: |
          git config user.name "ps5-catalogs-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogs sources.json SYNC_REPORT.md
          if git diff --staged --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "chore: sync catalogs $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
